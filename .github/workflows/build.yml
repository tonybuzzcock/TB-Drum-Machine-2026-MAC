name: Build and test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Mac runner (macos-15 = Apple Silicon, macos-15-intel = Intel)'
        required: false
        default: 'macos-15'

permissions:
  contents: write   # lets tagged builds attach the app to a GitHub Release

env:
  APP_NAME: TB Drum Machine
  APP_ZIP: TB-Drum-Machine-mac.zip
  ENGINE_SRC: Source/Engine/Engine.cpp Source/Engine/Wav.cpp Source/Engine/Export.cpp Source/Engine/Master.cpp

jobs:
  linux-tests:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Engine tests
        run: make -C Tests run CXX=g++

      - name: Engine tests under AddressSanitizer
        run: make -C Tests asan CXX=g++

  mac-app:
    name: TB Drum Machine.app for macOS 11+ (universal)
    runs-on: ${{ github.event.inputs.runner || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4

      - name: App icon
        run: |
          mkdir -p build
          iconutil -c icns Resources/TBDrumMachine.iconset -o build/TBDrumMachine.icns

      - name: Build, verify (universal, macOS 11) and sign the app
        run: scripts/build_app_mac.sh

      - name: Engine tests on this Mac (native architecture)
        run: |
          xcrun clang++ -std=c++17 -O2 -mmacosx-version-min=11.0 $ENGINE_SRC Tests/engine_test.cpp -o build/engine_test
          build/engine_test

      - name: Open the app offscreen, drive the panel, render screenshots
        run: |
          uname -m
          rm -rf build/gui && mkdir -p build/gui
          perl -e 'alarm 300; exec @ARGV' "build/$APP_NAME.app/Contents/MacOS/TBDrumMachine" --selftest build/gui

      - name: Run the self-test on the other architecture too (Rosetta, if present)
        continue-on-error: true
        run: |
          if [ "$(uname -m)" = "arm64" ] && arch -x86_64 /usr/bin/true 2>/dev/null; then
            rm -rf build/gui_x86 && mkdir -p build/gui_x86
            perl -e 'alarm 300; exec @ARGV' arch -x86_64 "build/$APP_NAME.app/Contents/MacOS/TBDrumMachine" --selftest build/gui_x86
          else
            echo "Intel runner or no Rosetta: skipped"
          fi

      - name: Upload panel screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-screenshots
          path: build/gui/*.png

      - name: Publish panel screenshots to the gui-preview branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/preview && mkdir /tmp/preview && cp build/gui/*.png /tmp/preview/
          cd /tmp/preview
          git init -q && git checkout -q -b gui-preview
          git -c user.name="github-actions" -c user.email="actions@github.com" add .
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Panel screenshots for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gui-preview

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: TB-Drum-Machine-mac
          path: build/${{ env.APP_ZIP }}

      - name: Attach to GitHub Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/$APP_ZIP" \
            --title "TB Drum Machine (2026 MAC) $GITHUB_REF_NAME" \
            --notes "Stand-alone drum machine, universal (Apple Silicon + Intel), macOS 11 and later. See INSTALL.txt in the zip." \
          || gh release upload "$GITHUB_REF_NAME" "build/$APP_ZIP" --clobber
